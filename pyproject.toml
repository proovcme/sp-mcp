[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sp-mcp"
version = "0.2.1"
description = "Evidence-first search and dated verification of Russian construction standards"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "beautifulsoup4>=4.13,<5",
    "platformdirs>=4,<5",
    "truststore>=0.10,<1",
    "pypdf>=6,<7",
    "snowballstemmer>=3,<4",
]

[project.scripts]
sp-mcp = "sp_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: bounded network acceptance checks", "uvyazka: optional local Uvyazka integration acceptance"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
